# OtterAmp DSP Configuration
# TAS5830 PF9 (1.1 bi-amped 96kHz)
# Flat passthrough - no processing active

[device]
sample_rate = 96000

[mixer]
# Presets: stereo, mono, left_only, right_only
mode = mono
# Custom gains override mode (in dB):
# l2l = 0
# r2l = 0
# l2r = 0
# r2r = 0

[channel_volume]
# Per-channel volume in dB (tweeter = left, woofer = right)
tweeter_db = 0
woofer_db = 0

[volume]
digital_db = -24
analog_gain = 0

[eq]
bypass = false

# 24-band parametric EQ (12 per channel)
# Bands 0-11 = tweeter/left channel
# Bands 12-23 = woofer/right channel
# Omitted bands default to passthrough
#
# [eq.0]
# type = peaking
# freq = 100
# gain_db = 3.0
# q = 1.41
#
# Filter types: peaking, low_pass, high_pass, low_shelf,
#               high_shelf, band_pass, notch, all_pass, bypass

[processing]
# Raw register pairs for DRC / output crossbar (hex): reg = val
# Empty = flat passthrough (no DRC)
